services:
  manager:
    build: .
    container_name: media-server-manager
    network_mode: "container:tailscale"
    environment:
      MANAGER_API_TOKEN: ${MANAGER_API_TOKEN:-change-me}
      MANAGER_ALLOWED_SERVICES: ${MANAGER_ALLOWED_SERVICES:-jellyfin,gluetun,deluge,sonarr,radarr,prowlarr,bazarr,jellyseerr,tailscale,samba}
      MEDIA_ROOT: /media-root
      DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT:-85}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEDIA_SERVER_ROOT:-.}:/media-root:ro
    group_add:
      # Linux hosts normally expose the socket through the Docker group GID.
      - "${DOCKER_GID:-999}"
      # Docker Desktop for Windows can mount /var/run/docker.sock as root:root (0660).
      # Add group 0 so the non-root manager user can still talk to the Docker API.
      - "0"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
